<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,user-scalable=0">
<title>うさぎロケットジャンプDX</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}
html,body{
width:100%;
height:100%;
overflow:hidden;
touch-action:none;
font-family:sans-serif;
background:#87ceeb;
}
.screen{
display:none;
width:100%;
height:100%;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
}
.screen.active{
display:flex;
}
button{
border:none;
border-radius:16px;
background:#ff9800;
color:#fff;
font-size:22px;
font-weight:bold;
padding:16px 28px;
min-width:200px;
}
h1{
font-size:42px;
margin-bottom:15px;
}
.desc{
line-height:1.8;
font-size:18px;
max-width:550px;
}
#gameScreen{
padding:0;
justify-content:flex-start;
}
#hud{
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
background:#222;
color:#fff;
font-weight:bold;
font-size:18px;
}
#gameArea{
position:relative;
width:100%;
flex:1;
overflow:hidden;
background:linear-gradient(#87ceeb,#e9fbff);
}
.ground{
position:absolute;
left:0;
bottom:0;
width:100%;
height:70px;
background:#4caf50;
}
#rabbit{
position:absolute;
left:55px;
bottom:70px;
font-size:56px;
z-index:10;
user-select:none;
}
.invincible{
animation:blink .18s infinite;
filter:drop-shadow(0 0 15px gold);
}
@keyframes blink{
50%{
opacity:.4;
}
}
.obstacle{
position:absolute;
font-size:42px;
bottom:70px;
}
.rocket{
position:absolute;
font-size:72px;
}
.carrot{
position:absolute;
font-size:48px;
}
#jumpBtn{
position:absolute;
right:15px;
bottom:85px;
width:125px;
height:125px;
border-radius:50%;
font-size:24px;
z-index:50;
}
#powerInfo{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
padding:8px 14px;
border-radius:20px;
background:#ffd54f;
font-weight:bold;
display:none;
z-index:40;
}
#rank{
font-size:42px;
font-weight:bold;
margin-top:15px;
color:#ff5722;
}
</style>
</head>
<body>

<div id="startScreen" class="screen active">
<h1>🐰うさぎロケットジャンプDX</h1>
<div class="desc">
30秒間生き残ろう！<br>
🪨岩に当たるとゲームオーバー！<br>
🚀ロケットで5秒間無敵！<br>
🥕にんじんで5点ゲット！<br>
前よりずっとむずかしいぞ！<br>
</div>
<button id="startBtn">スタート</button>
</div>

<div id="gameScreen" class="screen">
<div id="hud">
<div>スコア: <span id="score">0</span></div>
<div>残り: <span id="time">30</span>秒</div>
</div>

<div id="gameArea">
<div id="powerInfo">🚀無敵中！</div>
<div id="rabbit">🐰</div>
<div class="ground"></div>
<button id="jumpBtn">ジャンプ</button>
</div>
</div>

<div id="resultScreen" class="screen">
<h1>結果発表</h1>
<div style="font-size:28px;">最終スコア</div>
<div id="finalScore" style="font-size:62px;font-weight:bold;">0</div>
<div id="rank">C</div>
<button id="restartBtn">もう一度遊ぶ</button>
</div>

<script>
const startScreen=document.getElementById("startScreen");
const gameScreen=document.getElementById("gameScreen");
const resultScreen=document.getElementById("resultScreen");

const rabbit=document.getElementById("rabbit");
const gameArea=document.getElementById("gameArea");
const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const finalScoreEl=document.getElementById("finalScore");
const rankEl=document.getElementById("rank");
const powerInfo=document.getElementById("powerInfo");

let score=0;
let timeLeft=30;
let rabbitY=70;
let velocity=0;
let gravity=1.0;
let jumping=false;
let gameRunning=false;

let objects=[];
let gameLoop;
let spawnLoop;
let timerLoop;
let invincible=false;
let invincibleTimeout;

function showScreen(screen){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
screen.classList.add("active");
}

function activateInvincible(){
invincible=true;
rabbit.classList.add("invincible");
powerInfo.style.display="block";

clearTimeout(invincibleTimeout);

invincibleTimeout=setTimeout(()=>{
invincible=false;
rabbit.classList.remove("invincible");
powerInfo.style.display="none";
},5000);
}

function jump(){
if(!gameRunning)return;

if(!jumping){
velocity=17;
jumping=true;
}
}

document.getElementById("jumpBtn").addEventListener("pointerdown",jump);

gameArea.addEventListener("pointerdown",(e)=>{
if(e.target.id!=="jumpBtn"){
jump();
}
});

function spawnObject(){

if(!gameRunning)return;

const r=Math.random();
const obj=document.createElement("div");

if(r<0.15){

obj.className="rocket";
obj.dataset.type="rocket";
obj.textContent="🚀";
obj.style.bottom=(100+Math.random()*160)+"px";

}else if(r<0.30){

obj.className="carrot";
obj.dataset.type="carrot";
obj.textContent="🥕";
obj.style.bottom=(110+Math.random()*170)+"px";

}else{

obj.className="obstacle";
obj.dataset.type="rock";
obj.textContent=Math.random()<0.5?"🪨":"🧱";
obj.style.bottom="70px";
}

obj.style.left=gameArea.clientWidth+"px";

gameArea.appendChild(obj);
objects.push(obj);
}

function hit(a,b){
return(
a.left<b.right &&
a.right>b.left &&
a.bottom<b.top &&
a.top>b.bottom
);
}

function update(){

if(!gameRunning)return;

velocity-=gravity;
rabbitY+=velocity;

if(rabbitY<=70){
rabbitY=70;
velocity=0;
jumping=false;
}

rabbit.style.bottom=rabbitY+"px";

for(let i=objects.length-1;i>=0;i--){

const obj=objects[i];

let speed=11 + (30-timeLeft)*0.18;

if(obj.dataset.type==="rocket") speed+=1;
if(obj.dataset.type==="carrot") speed+=1.5;

let x=parseFloat(obj.style.left);
x-=speed;
obj.style.left=x+"px";

let size=50;

if(obj.dataset.type==="rocket") size=72;
if(obj.dataset.type==="carrot") size=48;
if(obj.dataset.type==="rock") size=44;

const rabbitRect={
left:55,
right:100,
bottom:rabbitY,
top:rabbitY+55
};

const bottom=parseFloat(obj.style.bottom);

const objRect={
left:x,
right:x+size,
bottom:bottom,
top:bottom+size
};

if(hit(rabbitRect,objRect)){

if(obj.dataset.type==="rocket"){

activateInvincible();
score+=3;
scoreEl.textContent=score;

obj.remove();
objects.splice(i,1);
continue;
}

if(obj.dataset.type==="carrot"){

score+=5;
scoreEl.textContent=score;

obj.remove();
objects.splice(i,1);
continue;
}

if(obj.dataset.type==="rock"){

if(invincible){

score+=2;
scoreEl.textContent=score;

obj.remove();
objects.splice(i,1);
continue;

}else{

finishGame(false);
return;
}
}
}

if(x<-120){

if(obj.dataset.type==="rock"){
score++;
scoreEl.textContent=score;
}

obj.remove();
objects.splice(i,1);
}
}

gameLoop=requestAnimationFrame(update);
}

function finishGame(clear){

gameRunning=false;

clearInterval(timerLoop);
clearInterval(spawnLoop);
cancelAnimationFrame(gameLoop);

finalScoreEl.textContent=score;

let rank="C";

if(score>=25) rank="B";
if(score>=50) rank="A";
if(score>=80) rank="S";
if(score>=110) rank="SS";

if(!clear){
rank="ゲームオーバー";
}

rankEl.textContent=rank;

showScreen(resultScreen);
}

function startGame(){

score=0;
timeLeft=30;

scoreEl.textContent=0;
timeEl.textContent=30;

rabbitY=70;
velocity=0;
jumping=false;

invincible=false;
rabbit.classList.remove("invincible");
powerInfo.style.display="none";

objects.forEach(o=>o.remove());
objects=[];

clearInterval(timerLoop);
clearInterval(spawnLoop);
clearTimeout(invincibleTimeout);
cancelAnimationFrame(gameLoop);

gameRunning=true;

showScreen(gameScreen);

timerLoop=setInterval(()=>{
timeLeft--;
timeEl.textContent=timeLeft;

if(timeLeft<=0){
finishGame(true);
}
},1000);

spawnLoop=setInterval(spawnObject,280);

update();
}

document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("restartBtn").addEventListener("click",startGame);

document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());
</script>

</body>
</html>
